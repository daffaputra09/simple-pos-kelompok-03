openapi: 3.0.0
info:
  title: Simple POS API
  version: 1.0.0
paths:
  /api/v1/login:
    post:
      summary: Login dan dapatkan token
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email: { type: string }
                password: { type: string }
      responses:
        '200':
          description: Token berhasil diterbitkan
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string }
        '401':
          description: Kredensial tidak valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string }

  /api/v1/products:
    get:
      summary: Ambil daftar produk
      security:
        - bearerAuth: []
      parameters:
        - name: category_id
          in: query
          description: Filter berdasarkan ID kategori
          required: false
          schema:
            type: integer
        - name: q
          in: query
          description: Kata kunci pencarian nama produk
          required: false
          schema:
            type: string
        - name: sort
          in: query
          description: Pengurutan data (contoh name, -name, price, -price)
          required: false
          schema:
            type: string
        - name: per_page
          in: query
          description: Jumlah item per halaman (1 sampai 100)
          required: false
          schema:
            type: integer
      responses:
        '200':
          description: Daftar produk berpaginasi
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id: { type: integer }
                        name: { type: string }
                        price: { type: integer }
                        category: { type: string }
        '401':
          description: Token tidak ada atau tidak valid

  /api/v1/transactions:
    post:
      summary: Buat transaksi baru
      security:
        - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                items:
                  type: array
                  items:
                    type: object
                    properties:
                      product_id: { type: integer }
                      qty: { type: integer }
      responses:
        '201':
          description: Transaksi berhasil disimpan
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      id: { type: integer }
                      total: { type: integer }
        '401':
          description: Token tidak ada atau tidak valid
        '422':
          description: Input tidak valid, misalnya product_id tidak ditemukan

  /api/v1/transactions/{id}:
    get:
      summary: Detail transaksi
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Detail data transaksi
        '403':
          description: Akses ditolak
        '404':
          description: Transaksi tidak ditemukan

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer